; Mounted into Playground's PHP extension ini directory as
; zz-xdebug-coverage.ini for `npm run test:plugin-php:coverage`.
;
; @php-wasm hardcodes `xdebug.mode=debug,develop` when it generates
; xdebug.ini at boot, and exposes no option to change it. PHP scans that
; directory alphabetically and lets later files win, so the `zz-` prefix
; makes this override xdebug.ini.
;
; This is mounted rather than patched at runtime from a blueprint step: the
; CLI runs a pool of workers, each with its own in-memory /internal, so a
; blueprint write lands in one worker while the tests may run in another.
; The pool size is derived from the CPU count, which is why runtime patching
; worked on a 14-core laptop and never worked on a 4-core CI runner.
xdebug.mode=coverage
